[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "urbanmarl"
version = "0.1.0"
description = "Vectorized urban Multi-Agent reinforcement Learning for 6G network digital twins"
readme = "README.md"
authors = [
    { name = "Basheer Raddwan", email = "yelinux@gmail.com" }
]
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "marl",
    "reinforcement-learning",
    "uav",
    "mec",
    "torchrl",
    "benchmarl",
    "6g",
    "urban-simulation",
    "digital-twin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0",
    "torchrl>=0.13.3",
    "tensordict>=0.3.0",
    "benchmarl @ git+https://github.com/yemenlinux/BenchMARL.git",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "gymnasium>=1.3.0",
    "moviepy",
    "opencv-python>=4.7.0",
    "av",
]

[project.urls]
Homepage = "https://github.com/yemenlinux/vUrbanMARL"
Documentation = "https://vurbanmarl.readthedocs.io"
Repository = "https://github.com/yemenlinux/vUrbanMARL.git"
Issues = "https://github.com/yemenlinux/vUrbanMARL/issues"

[project.optional-dependencies]
cpu = [
    "torch>=2.2.0",
    "torchvision",
]
cuda126 = [
    "torch>=2.2.0",
    "torchvision",
]
cuda130 = [
    "torch>=2.2.0",
    "torchvision",
]
cuda132 = [
    "torch>=2.2.0",
    "torchvision",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["urbanmarl"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cuda126" },
    { index = "pytorch-cu130", extra = "cuda130" },
    { index = "pytorch-cu132", extra = "cuda132" },
    { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
    { index = "pytorch-cu126", extra = "cuda126" },
    { index = "pytorch-cu130", extra = "cuda130" },
    { index = "pytorch-cu132", extra = "cuda132" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
