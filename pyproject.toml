[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["urbanmarl"]
module-root = ""



[project]
name = "urbanmarl"
version = "0.3.1"
description = "Vectorized urban Multi-Agent reinforcement Learning for 6G network digital twins"
readme = "README.md"
authors = [
    { name = "Basheer Raddwan", email = "yelinux@gmail.com" },
    { name = "Ibrahim Al-Baltah", email = "albalta2020@gmail.com" },
]
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "marl",
    "reinforcement-learning",
    "uav",
    "mec",
    "torchrl",
    "benchmarl",
    "6g",
    "urban-simulation",
    "digital-twin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0",
    "torchrl>=0.13.3",
    "tensordict>=0.13.0",
    #"benchmarl>=1.5.2",
    "benchmarl @ git+https://github.com/yemenlinux/BenchMARL.git",
    "hydra-core>=1.3.2",
    "torch-geometric>=2.8.0",
    "torchcodec>=0.10.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.14.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "gymnasium>=1.3.0",
    "wandb>=0.15.0",
    "moviepy",
    "opencv-python>=4.7.0",
    "av",
    #"id-marl-eval",
    "jupyterlab",
]

[project.urls]
Homepage = "https://github.com/yemenlinux/vUrbanMARL"
Documentation = "https://yemenlinux.github.io/vUrbanMARL"
Repository = "https://github.com/yemenlinux/vUrbanMARL.git"
Issues = "https://github.com/yemenlinux/vUrbanMARL/issues"

[project.optional-dependencies]
benchmarl = [
    "benchmarl>=1.5.2",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
torch-backend = "auto"
upgrade = true
upgrade-package = ["torchrl"]

[tool.uv.pip]
torch-backend = "auto"
upgrade = true
upgrade-package = ["torchrl"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
