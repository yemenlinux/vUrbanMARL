[metadata]
description-file=README.md

[pep8]
max-line-length = 120

[flake8]
max-line-length = 88
ignore = E203, E402, W503, W504, E501, W605, B028, E226
per-file-ignores =
    __init__.py: F401, F403, F405
    test_*.py: F841, E731, E266, F401, B007, E711
    tests/*: F841, E731, E266, F401, B007, E711
    scripts/*: F401, F841
    urbanmarl/eval_results.py: B006, B007, C408, C414, C416, E731, F401, F811, F841
    docs/source/conf.py: F401
exclude =
    .git,
    .venv,
    venv,
    build,
    dist,
    docs/_build
extend-select = B901, C401, C408, C409
